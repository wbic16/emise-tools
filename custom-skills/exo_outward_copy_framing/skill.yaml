  rationale: One evening of Boardy pitch work drew repeated corrections from Will with one shared shape. He directed dropping material that made the work look incompetent (7aee632b), then corrected the framing directly, in the packet's words, that public posts could be read but private messages could not, so an unplaced result was an access boundary and not a capability gap (e4ddcf1f). The lesson was recorded in the session as stating an access limit as access, never dressed as a capability gap (assistant-msg-d99cc360), and the corrected draft followed it (assistant-msg-f777539b). In the same sequence the draft also followed the other party's framing into a topic Will ruled out of scope (849e58a5), and that material had to be removed (assistant-msg-20541301). Skill search found no existing skill covering outward pitch framing. The closest documents cover paid advertising, consented outreach to existing customers and social publishing, none of which teaches access versus capability framing or scope fidelity against an interlocutor. The other recurring shapes in this window are already covered by managed skills still inside their measurement windows, by distill_process_to_skill for skills index placement, or by repairs already made in session, so this is the only proposal.
