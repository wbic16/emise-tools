  rationale: Consolidation of the two phext learned skills into one. phext_reference_conformance rests on the qexo chain where a hand rebuilt parser and serializer were wrong together and passed only on self written files (66c76793, 650b91ee), fixed by swapping in libphext-rs with a foreign-shape regression test (907987bb) after Will stated the rule three times (f2164d82). phext_native_dispatch rests on the selector built and published at commit 475c8e2d (assistant-msg-64d91684, from 56fff959) and on a worker that searched a phext as flat text and reported a false failure (assistant-msg-3c72016f, corrected in assistant-msg-9adb2931). Both govern how phext is read and written, so one skill with distinct reference, conformance and dispatch sections preserves both methods without overlap, retiring both superseded skills in this batch. The other five learned skills (monitor_long_running_jobs, outward_copy_framing, review_pr_composition, safeguard_live_state_files, staged_deploy_permissions) cover distinct mechanisms and stay as they are.
