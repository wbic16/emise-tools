name: "handwriting-practice"
title: "Handwriting Practice — the Emise font, learned like a child"
description: "Will's daily handwriting-practice program: a biologically-inspired child motor model traces the current Emise font through lossy-but-stable multi-spectral command channels (seeded, delays drawn randomly per session), learns bias before variance, persists as memory across sessions, and ages over 20 wavelets — perception resolution degrades by a small jittered amount while anticipation grows — reaching a defined maturity at wavelet 20. It cuts new Emise font versions from measured matured output — every change citing its measurement — behind a QC gate (coverage, mono advances, topology, no new self-intersections, O/0 reader probe), with a blog post per version and auto-install on QC pass to edit.phext.io / Phext Notepad, Phextron, and Singularity Watch."
