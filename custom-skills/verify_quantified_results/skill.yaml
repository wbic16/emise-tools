    success_criterion: During the window, quantified results reported to the user or shared externally carry a reproduction record with artifact hashes and negative and mutation controls, and no shared headline number is later withdrawn because it measured an empty, stale or wrong artifact.
    window_days: 30
  needs_review: false
  rationale: Will challenged a headline compression figure with the observation that it sounded like an undetected failure (d501ca3a). The figure had already entered a draft external pitch from a builder run without independent reproduction (assistant-msg-fcce72ef), and the first retest measured a zero byte store and reported no changes while the underlying transfer had actually failed (assistant-msg-72eb7ce6). Only a later mutation suite with out of band changes and a byte exact no-change control settled the claim (assistant-msg-48ff1b76). A parallel episode showed hash only publish verification hiding lost execute bits (assistant-msg-43edd666). Skill and connector searches found no existing document that codifies reproducing a quantified result from primary artifacts with negative and mutation controls before external use, so this skill adds that missing procedure without restating the standing rules already recorded for hashing, pushing or phext handling.
