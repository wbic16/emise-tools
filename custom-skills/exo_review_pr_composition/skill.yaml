name: exo_review_pr_composition
title: Review PR Composition
description: Test related open pull requests as one composed tree with an explicit merge order, so PRs that pass alone but break together are caught before merge.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
