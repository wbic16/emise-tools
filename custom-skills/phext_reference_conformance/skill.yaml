    success_criterion: During the window, no phext parsing or serialization change ships a hand rolled parser where a reference implementation exists, and every such change records a conformance run against files written by another implementation or tool, with any divergence turned into a regression test using the foreign file shape that exposed it.
    window_days: 30
  needs_review: false
  rationale: The qexo episode in this window is a complete failure chain with one mechanism. A phext parser and serializer were reconstructed instead of using libphext-rs, both were wrong together in a self consistent way, and the gates passed because qexo only ever read files qexo wrote (assistant 66c76793). The divergence surfaced only on a foreign shape, a Notepad edited scroll set against an empty configuration line (243-25470840), and Will had to state the rule himself three times (f2164d82, 01314df7, db94c76a) before the fix swapped in libphext-rs with a regression test on the exact file shape (907987bb). The root cause record shows the delimiter ladder was rebuilt from partial memory and never compared to a reference, with a Library delimiter value invented in the process (650b91ee), and state written by the divergent serializer then needed a ranch wide wipe runbook (65185ddb, 328d2475). Skill search found no skill covering reference use or foreign file conformance. phext_upgrade only checks that an upgrade writer agrees with a delimiter walk parser, phext_native_dispatch covers worker briefs, and verify_quantified_results covers quantified claims, so this proposal covers only the parser conformance gap. Other candidates were not proposed because they are already covered by managed skills still inside their measurement windows, including monitor_long_running_jobs for stalled background work, verify_blocker_and_completion_claims for stale state and unprobed claims, and verify_quantified_results for counts reported before the underlying material was read.
