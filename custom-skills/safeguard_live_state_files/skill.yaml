name: safeguard_live_state_files
title: Safeguard Live State Files
description: Protect live registers, ledgers and state files by probing writes only on copies, proving recovery before any risky write, and verifying content after every write.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
  evidence_handles:
