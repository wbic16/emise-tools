  rationale: Evidence shows a delegated agent ended without filing its report (assistant-msg-de975766), leaving distillation, queue and mastery status unknown even though a filing had landed. The user directed a recovery pass on any job failure (eb247eff), and the recorded recovery (assistant-msg-2fb33d71, assistant-msg-594c8409) verified artifacts first-hand, published the missing mastery item, added the queue entry, and named a phantom library gap without improvising a fix. The existing managed monitor_long_running_jobs skill covers stall detection and rebalancing during a run, not post-failure verification and scope-bound closure, and it is still inside its measurement window to 2026-12-07, so this proposal adds the distinct missing step rather than layering onto it.
