    success_criterion: Over the window, every delegated or background job that fails or ends without a report gets a documented recovery pass that verifies what landed first-hand, and at least half of those recoveries close or explicitly name all loose ends in the original scope with no recovered item later shown to be missing or unverified.
    window_days: 21
