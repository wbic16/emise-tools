  rationale: 'Will asked what phext-native parsing would do for workers (56fff959). The answer identified the gap as owned tooling and inputs, not the model: a canonical selector in the standard worker toolset, inputs arriving as addressed scrolls rather than prose about phext, and selection instead of whole-file ingestion (assistant-msg-904b9e26). The one-pass converter was then built and published as phext/phext_dispatch.py in wbic16/emise-tools@exo at commit 475c8e2d with its mode and remote blob verified (assistant-msg-64d91684), and the file itself was re-read in this audit and carries the coordinate, prefix, pagination, and provenance behavior the skill cites. The cost of the missing procedure is already on record: a duplicate journal worker searched a phext-backed log for a literal marker string, found none, and reported a failure that the main thread surfaced before a disk, log, and remote check showed the pass had published at ced950cc (assistant-msg-3c72016f, corrected in assistant-msg-9adb2931). Skill searches for phext dispatch, phext-native briefs, and worker verification returned dispatch_to_subagents, choir_mailbox_dispatch, and phext_memory_publishing, and reading the first and third showed neither mandates the selector tool or coordinate-addressed briefs, so this adds the missing procedure without restating theirs. Other candidate patterns from this window were left alone because existing managed skills already cover them or they remain inside their measurement windows: validate_waiting_items, verify_blocker_and_completion_claims, verify_quantified_results, and monitor_long_running_jobs, the last with review_after 2026-12-07. Only four managed learned skills are active, so no consolidation is due.'
