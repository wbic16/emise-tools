name: monitor_long_running_jobs
title: Monitor Long-Running Jobs for Stalls
description: Detect stalled background, ranch and coordinator jobs from their artifacts and rebalance idle workers before hours are lost.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
  evidence_handles:
  - assistant-msg-5cf5ef03
  - assistant-msg-71634122
  - assistant-msg-970cda74
  - assistant-msg-81a4edde
  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: During the window, no launched background, ranch or coordinator job goes more than one stall threshold interval without an artifact or log progress check recorded in its task record, and no coordinator sweep leaves a finished worker idle while units remain unassigned.
    window_days: 30
  needs_review: false
  rationale: Three independent stalls in this window share one shape, work running outside runtime delivered subagents produced no checkable progress and nobody noticed for over an hour. An ultra builder ran 2 hours 19 minutes with no files after an early WordNet failure (assistant-msg-5cf5ef03). A placement script ran 95 minutes silently searching 31k words one by one (assistant-msg-71634122). A V14 coordinator showed no activity for about 89 minutes while finished nodes sat idle with 19 of 27 chunks done, and only finished after it was kicked and then verified (assistant-msg-970cda74, assistant-msg-81a4edde). Skill search found dispatch_to_subagents, which covers runtime delivered children and says results are integrated when they land and never polled, and no skill covering artifact checkpoints, stall thresholds or coordinator rebalancing for self launched background, ranch and coordinator jobs. This proposal fills only that gap and leaves the subagent rule untouched. The register creation recurrence was considered and not proposed, because waiting_on_will_register already states the creation rule and its tick step that repairs prose only waits, and validate_waiting_items is still inside its measurement window.
