[package]
name = "phext-dep-lint"
version = "0.1.0"
edition = "2021"
description = "Dependency linter enforcing phext-minimum-viable-dependencies: a Rust crate is allowed only if a phext-based audit scroll with a passing verdict is on record for it."
license = "MIT"

# Zero dependencies, by policy. This tool enforces the minimum-viable-
# dependency rule, so it is built from the standard library alone:
# the TOML subset, Cargo.lock, phext, and JSON handling are all
# implemented in-tree from scratch. Its own tree is the first proof.
[dependencies]

[profile.release]
opt-level = 2
