# phext-dep-lint per-project exceptions.
#
# An exception is a recorded, reasoned, per-project allowance — never
# silent, never global. Every crate exception must reference an audit
# scroll that exists in audits.phext (field `audit`, defaulting to the
# crate name). An exception does not change the audit's verdict; it
# records that this project continues to use the crate anyway, and
# why. Budget exceptions use `budget = N` instead of `crate`.
#
# Seeded EE 1017 (2026-11-26) from the seed audit pass. Will may
# strike any of these; striking one turns the project's finding back
# into a lint failure in the report, which is the honest state.

[[exception]]
project = "sq"
crate = "raw_sync"
audit = "raw_sync"
reason = "SQ's shipping IPC implementation is built on raw_sync primitives. Audit verdict is FAIL (0.1.x, 14-package tree on a critical path); continued use is recorded here while a first-party replacement is an open project, not a lint fix."

[[exception]]
project = "sq"
crate = "shared_memory"
audit = "shared_memory"
reason = "SQ's IPC architecture is founded on shared_memory (18 of SQ's 55 lock packages). Audit verdict is FAIL on dependency shape; replacing it is an SQ architecture project. Recorded so the cost stays visible in every report."
