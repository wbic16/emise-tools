# bickfordllamaranch.com — public homepage. TLS via certbot (see README).
# SQ key is injected by deploy.sh into /etc/bickford-llama-ranch/sq-proxy.conf
# (proxy_set_header Authorization "...") — the key never appears in this repo
# or in any JavaScript.
server {
    listen 80;
    server_name bickfordllamaranch.com www.bickfordllamaranch.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name bickfordllamaranch.com www.bickfordllamaranch.com;
    # Cert lineage paths (deterministic); this vhost is only enabled once
    # the root DNS points at this box and the cert exists (deploy.sh checks).
    ssl_certificate /etc/letsencrypt/live/bickfordllamaranch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bickfordllamaranch.com/privkey.pem;
    root /sites/web/bickfordllamaranch.com;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # READ-ONLY SQ proxy: only select / toc / version, GET only.
    location ~ ^/api/v2/(select|toc|version)$ {
        limit_except GET { deny all; }
        include /etc/bickford-llama-ranch/sq-proxy.conf;
        proxy_pass http://127.0.0.1:18765;
    }
    location /api/ { return 404; }   # every other SQ endpoint stays private

    location / { try_files $uri $uri/ =404; }
}
