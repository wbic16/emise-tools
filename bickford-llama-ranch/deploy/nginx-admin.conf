# admin.bickfordllamaranch.com — herd admin. TLS via certbot (see README).
# The WHOLE vhost sits behind nginx Basic Auth (htpasswd), including /api —
# so the SQ key (injected server-side by the proxy include) is never exposed
# to a browser that has not already passed basic auth, and is never in JS.
server {
    listen 80;
    server_name admin.bickfordllamaranch.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name admin.bickfordllamaranch.com;
    # Cert obtained via a temporary port-80-only vhost + `certbot --nginx`
    # (see deploy/STAGING-REPORT.md); paths are certbot's deterministic
    # lineage paths, so this file stays valid across re-deploys.
    ssl_certificate /etc/letsencrypt/live/admin.bickfordllamaranch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bickfordllamaranch.com/privkey.pem;
    root /sites/web/admin.bickfordllamaranch.com;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    auth_basic "Bickford Llama Ranch";
    auth_basic_user_file /etc/bickford-llama-ranch/htpasswd;

    # Full SQ API (read + update) — but only after basic auth, and the
    # Authorization token for SQ is added here, server-side.
    location /api/v2/ {
        include /etc/bickford-llama-ranch/sq-proxy.conf;
        proxy_pass http://127.0.0.1:18765;
    }
    location / { try_files $uri $uri/ =404; }
}
